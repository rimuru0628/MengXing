name: mengxing
description: MengXing (梦行) - Daily Exercise & Walking Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^17.5.0

  # Health & Activity
  health: ^13.3.1
  pedometer: ^4.0.2
  permission_handler: ^11.4.0
  geolocator: ^14.0.2

  # Charts
  fl_chart: ^1.2.0

  # Maps (optional)
  google_maps_flutter: ^2.6.0
  flutter_polyline_points: ^3.1.0

  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # UI & UX
  cached_network_image: ^3.3.1
  image_picker: ^1.1.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  shimmer: ^3.0.0
  table_calendar: ^3.1.1
  percent_indicator: ^4.2.3
  fl_heatmap: ^0.4.6
  smooth_page_indicator: ^3.0.0
  dotted_border: ^3.1.0
  badges: ^3.1.2
  timeline_tile: ^2.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  collection: ^1.18.0
  path_provider: ^2.1.3
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  confetti: ^0.8.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A0A2E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 26
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/exercises/
    - assets/kuromi/
